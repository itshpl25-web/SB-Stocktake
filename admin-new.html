<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockTake Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="admin.css?v=5"/>
</head>
<body>

<!-- PIN gate (unchanged behaviour: client-side PIN, asked on every load) -->
<div class="gate" id="gate">
  <form class="panel gate-card" id="pin-form" autocomplete="off">
    <div class="gate-brand"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg></i>StockTake</div>
    <h1>Admin access</h1>
    <p>Enter your PIN to continue.</p>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="10" placeholder="PIN" aria-label="PIN" autocomplete="off"/>
    <div class="err" id="pin-err" role="alert"></div>
    <button class="btn btn-primary" type="submit">Unlock</button>
  </form>
</div>

<!-- App shell -->
<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand">
      <i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg></i>
      <span>StockTake</span><em>Admin</em>
    </div>
    <div class="side-scope" id="side-scope" aria-live="polite"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">Admin only. Do not share this URL.</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="scope">
        <label>Outlet <select id="g-outlet" class="outlet-sel"></select></label>
        <label>Department <select id="g-dept"></select></label>
      </div>
      <div class="live" id="live" hidden>
        <span class="dot" id="live-dot"></span><span id="live-txt">Live</span>
        <button class="btn sm btn-ghost" id="live-btn" type="button">Pause</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Detail" hidden></aside>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Preview" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Hidden until printing: holds the A4 sheets for the Zone Count Report -->
<div id="print-area" aria-hidden="true"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="admin.js?v=5"></script>
<script src="admin-sessions.js?v=2"></script>
<script src="admin-recon.js?v=1"></script>
<script src="admin-uploads.js?v=2"></script>
<script src="admin-export.js?v=2"></script>
<script src="admin-clear.js?v=1"></script>
<script src="admin-dashboard.js?v=2"></script>
</body>
</html>
